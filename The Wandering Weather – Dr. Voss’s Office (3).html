<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wandering Weather – Dr. Voss’s Office</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#161a14;--ink:#f2f2f2;--mut:#aaa;--pn:#2b2b2b;--hi:#555;--lo:#1a1a1a;--bt:#6d6d6d;--ac:#8fd16a;--pa:#e9d8a6;--pi:#2a2110;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#b9c9a8;--ink:#1a1a1a;--mut:#444;--pn:#c6c6c6;--hi:#fff;--lo:#7a7a7a;--bt:#a0a0a0}}
:root[data-theme="light"]{--bg:#b9c9a8;--ink:#1a1a1a;--mut:#444;--pn:#c6c6c6;--hi:#fff;--lo:#7a7a7a;--bt:#a0a0a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.3rem/1.25 VT323,"Courier New",monospace}
main{max-width:940px;margin:0 auto;padding:12px}
h1{font-size:1.9rem;margin:4px 0 10px;letter-spacing:.04em}h2{font-size:1.3rem;margin:0 0 8px}
.p{background:var(--pn);border:3px solid #000;box-shadow:inset 3px 3px var(--hi),inset -3px -3px var(--lo);padding:12px;margin-bottom:12px}
.stage{position:relative;border:3px solid #000}
canvas{width:100%;display:block;image-rendering:pixelated;aspect-ratio:16/9}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
button,select{font:inherit;color:var(--ink);background:var(--bt);border:3px solid #000;box-shadow:inset 2px 2px var(--hi),inset -2px -2px var(--lo);padding:4px 10px;cursor:pointer}

#enter{font-size:1.6rem;padding:10px 22px}
#who{color:var(--ac)}#you{color:var(--mut);min-height:1.2em}#txt{min-height:3.8em;font-size:1.45rem;margin:4px 0 8px}
#opts{display:grid;gap:8px}#opts button{text-align:left;font-size:1.35rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
#book{background:var(--pa);color:var(--pi);box-shadow:inset 3px 3px #fff8,inset -3px -3px #0003}
#notes{margin:0;padding-left:22px;max-height:260px;overflow:auto}#notes li{margin-bottom:5px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:1rem;color:var(--mut)}label.sw{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
input[type=range]{width:110px;accent-color:var(--ac)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
#msg{color:var(--mut);font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>⛏ The Wandering Weather</h1>
<div class="stage"><canvas id="cv" width="192" height="108"></canvas>
<div id="gate"><button id="enter">🚪 Enter the office</button></div></div>

<div class="p"><div id="who">Dr. Voss <span style="color:var(--mut)" id="case"></span></div><div id="you"></div><div id="txt"></div><div id="opts"></div><div id="topics" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div><div style="color:var(--mut);font-size:1.05rem;margin-top:6px">Ask Dr. Voss about a topic. The history and physics in this salon are real; the opinions are Voss’s.</div></div>

<div class="two">
<div class="p" id="book"><h2>📓 Dr. Voss’s notebook</h2><ol id="notes"><li>Nothing yet. Suspicious.</li></ol></div>
<div class="p"><h2>🎵 Driftbox radio</h2>
<div class="ctl">
<button id="start">▶ Play</button>
<label>Scale<select id="scale"></select></label>
<label>Key<select id="root"></select></label>
<label>Tempo<input type="range" id="bpm" min="46" max="110"></label>
<label>Space<input type="range" id="wet" min="0" max="100"></label>
<label class="sw"><input type="checkbox" id="evo" checked>Auto-evolve</label>
<label class="sw"><input type="checkbox" id="dr">Drums</label>
<button id="evnow">⚡ Evolve now</button>
</div>
<div id="chips"></div>
<div id="msg">Change the sound and the sky outside follows. The doctor writes it all down.</div>
</div></div>
</main>
<script>
const $=i=>document.getElementById(i),pk=a=>a[Math.random()*a.length|0];
const SC={"Minor":[0,2,3,5,7,8,10],"Dorian":[0,2,3,5,7,9,10],"Phrygian":[0,1,3,5,7,8,10],"Minor pentatonic":[0,3,5,7,10],"Major":[0,2,4,5,7,9,11],"Major pentatonic":[0,2,4,7,9],"Whole tone":[0,2,4,6,8,10],"Harmonic minor":[0,2,3,5,7,8,11]};
const NN=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const PR=[[0,5,3,4],[0,3,4,3],[0,2,5,4],[5,3,0,4],[0,6,5,4]];
const S={scale:"Minor",root:9,bpm:72,wet:.55,drums:false,evo:true,play:false,step:0,next:0,prog:PR[0]};
let ctx,mg,dry,wet,dl,an,nb,act=0,timer;
const pc=d=>{const n=SC[S.scale].length;return((d%n)+n)%n};
const fq=(o,d)=>{const sc=SC[S.scale],n=sc.length;return 440*Math.pow(2,(12*(o+1)+S.root+sc[pc(d)]+12*Math.floor(d/n)-69)/12)};
function init(){
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 const cp=ctx.createDynamicsCompressor();an=ctx.createAnalyser();an.fftSize=256;cp.connect(an);an.connect(ctx.destination);
 mg=ctx.createGain();mg.gain.value=.6;const lp=ctx.createBiquadFilter();lp.frequency.value=2600;mg.connect(lp);
 dry=ctx.createGain();lp.connect(dry);dry.connect(cp);wet=ctx.createGain();wet.connect(cp);
 dl=ctx.createDelay(2);const fb=ctx.createGain();fb.gain.value=.45;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);
 const vb=ctx.createConvolver(),L=ctx.sampleRate*1.6|0,ir=ctx.createBuffer(2,L,ctx.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
 vb.buffer=ir;lp.connect(vb);vb.connect(wet);
 nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const n=nb.getChannelData(0);for(let i=0;i<n.length;i++)n[i]=Math.random()*2-1;fx();
}
function fx(){if(!ctx)return;wet.gain.value=S.wet*.7;dry.gain.value=1-S.wet*.25;dl.delayTime.value=60/S.bpm*.75}
function vo(f,w,d,ty,v,pad){if(act>24&&!pad)return;const g=ctx.createGain(),o=ctx.createOscillator(),a=pad?d*.3:.01,e=w+(pad?d*1.3:d*1.8);
 o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(v*.25,w+a);g.gain.exponentialRampToValueAtTime(.001,e);
 o.connect(g);g.connect(mg);o.start(w);o.stop(e+.05);act++;o.onended=()=>{o.disconnect();g.disconnect();act--}}
function kick(w){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(130,w);o.frequency.exponentialRampToValueAtTime(40,w+.14);g.gain.setValueAtTime(.6,w);g.gain.exponentialRampToValueAtTime(.001,w+.4);o.connect(g);g.connect(mg);o.start(w);o.stop(w+.42)}
function hat(w){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;f.type="highpass";f.frequency.value=7500;g.gain.setValueAtTime(.12,w);g.gain.exponentialRampToValueAtTime(.001,w+.05);s.connect(f);f.connect(g);g.connect(mg);s.start(w);s.stop(w+.1)}
const ct=cr=>cr+pk([0,2,4,7]);
function tick(){const sd=60/S.bpm/4;if(S.next<ctx.currentTime-.05)S.next=ctx.currentTime+.05;
 while(S.next<ctx.currentTime+.2){const st=S.step,at=S.next,cr=pc(S.prog[(st>>5)%4]);
  if(st>0&&st%128===0&&S.evo)evolve();
  if(st%32===0)[0,2,4].forEach(o=>vo(fq(3,cr+o),at,sd*32,"triangle",.8,1));
  if(st%8===0)vo(fq(2,cr),at,sd*8,"sine",.9);
  if(st%2===0&&Math.random()<.5)vo(fq(4,ct(cr)),at,sd*2,"triangle",.45);
  if(st%4===0&&Math.random()<.35)vo(fq(5,ct(cr)),at,sd*4,"sine",.35);
  if(S.drums){if(st%8===0)kick(at);if(st%4===2)hat(at)}
  S.step++;S.next+=sd}}
function play(){if(!ctx)init();ctx.resume();S.play=true;S.next=ctx.currentTime+.1;timer=setInterval(tick,30);$("start").textContent="■ Stop"}
function stop(){S.play=false;clearInterval(timer);$("start").textContent="▶ Play"}
function evolve(){S.prog=pk(PR).slice();S.root=(S.root+pk([0,5,7,3,9,2]))%12;if(Math.random()<.8)S.scale=pk(Object.keys(SC));
 S.bpm=Math.max(50,Math.min(100,S.bpm+Math.round((Math.random()-.5)*20)));S.drums=Math.random()<.4;fx();sync()}
function sync(){$("scale").value=S.scale;$("root").value=S.root;$("bpm").value=S.bpm;$("wet").value=S.wet*100;$("dr").checked=S.drums}
$("scale").innerHTML=Object.keys(SC).map(k=>`<option>${k}</option>`).join("");
$("root").innerHTML=NN.map((n,i)=>`<option value="${i}">${n}</option>`).join("");
$("start").onclick=()=>{try{S.play?stop():play()}catch(e){$("msg").textContent="Audio couldn’t start here. Try again."}};
$("scale").onchange=e=>S.scale=e.target.value;$("root").onchange=e=>S.root=+e.target.value;
$("bpm").oninput=e=>{S.bpm=+e.target.value;fx()};$("wet").oninput=e=>{S.wet=e.target.value/100;fx()};
$("evo").onchange=e=>S.evo=e.target.checked;$("dr").onchange=e=>S.drums=e.target.checked;
$("evnow").onclick=evolve;
const MOODS={bright:()=>S.scale="Major pentatonic",dark:()=>S.scale="Minor",dreamy:()=>{S.scale="Whole tone";S.wet=.85},tense:()=>{S.scale="Harmonic minor";S.bpm=92},haunted:()=>S.scale="Phrygian",hazy:()=>S.scale="Minor pentatonic",gentle:()=>S.scale="Major"};
Object.keys(MOODS).forEach(m=>{const b=document.createElement("button");b.textContent=m;b.onclick=()=>{MOODS[m]();S.prog=pk(PR).slice();fx();sync();if(!S.play)play()};$("chips").appendChild(b)});
sync();

// ---- weather from sound ----
const WN={sunny:"sunshine",cloudy:"scattered clouds",overcast:"heavy overcast",rain:"steady rain",storm:"a thunderstorm",snow:"snowfall",fog:"thick fog"};
const SK={sunny:"#6fb7ff",cloudy:"#7ab4ee",overcast:"#8a95a3",rain:"#5d6672",storm:"#2f3542",snow:"#aab4c4",fog:"#b9bec4"};
const AM={sunny:"rgba(255,220,120,.08)",cloudy:"rgba(0,0,0,0)",overcast:"rgba(60,70,90,.14)",rain:"rgba(40,50,70,.22)",storm:"rgba(10,15,40,.4)",snow:"rgba(200,220,255,.1)",fog:"rgba(210,215,220,.16)"};
const CL={sunny:1,cloudy:3,overcast:5,rain:5,storm:5,snow:4,fog:2};
function wxNow(){const s=S.scale;let k=s==="Major pentatonic"?"sunny":s==="Major"?"cloudy":s==="Dorian"?"overcast":s==="Minor"?"rain":(s==="Phrygian"||s==="Harmonic minor")?"storm":s==="Whole tone"?"snow":"fog";
 if(S.wet>.82&&k!=="sunny"&&k!=="storm")k="fog";return k}
let wx="cloudy",pw="cloudy",fade=1,notes=[],sig="",t0=0,entered=false,seen=0;
const wind=()=>S.bpm>85?1:S.bpm<58?.15:.5;
function clk(){const s=((performance.now()-t0)/1000)|0;return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function watch(force){if(!entered)return;const k=wxNow(),sg=S.scale+"|"+S.root+"|"+Math.round(S.bpm/8)+"|"+S.drums;
 if(!force&&sg===sig&&k===wx)return;
 const desc=`${NN[S.root]} ${S.scale.toLowerCase()}, ${S.bpm} bpm${S.drums?", drums":""}`;
 let txt=force?`Session begins. ${desc} → ${WN[k]}.`:k!==wx?`Sound shifted to ${desc}. The sky answered: ${WN[wx]} → ${WN[k]}.`:`Sound shifted to ${desc}. Sky unmoved (${WN[k]}). Odd.`;
 sig=sg;if(k!==wx){pw=wx;wx=k;fade=0}
 notes.unshift(`[${clk()}] ${txt}`);$("notes").innerHTML=notes.slice(0,14).map(n=>`<li>${n}</li>`).join("");$("msg").textContent="Forecast from the band: "+WN[k]+".";}
setInterval(()=>watch(false),600);

// ---- dialogue (intentionally repetitive loop) ----
const ND=[
{q:["Sit. Same chair as always. Tell me, where were you when the sky last changed?","Same chair, same question. Where were you when the sky last changed?","Sit. Do not touch the pencil. Where were you when the weather turned?"],o:[["Right here, listening.",["Listening. Everyone says that. Noted.","Listening. The classic alibi. Noted.","Right here. The chair confirms nothing."]],["Outside. I saw it happen.",["Outside. Interesting. The window disagrees.","Outside, you say. Your shoes are dry.","You saw it? Then why do you look so surprised?"]],["I don’t remember.",["Forgetting is a kind of evidence.","Forgetting. The most honest lie there is.","A gap in memory. I will fill it with ink."]]]},
{q:["Right now the window shows {W}. Does that feel like your doing?","Look outside. {W}. Coincidence, or your handiwork?","The window insists on {W}. Did you arrange that?"],o:[["Yes, the music did it.",["The music. Yes. I wrote that down twice.","A confession! Smaller than I hoped, but a confession.","The music. I suspected the speakers all along."]],["No, weather is weather.",["Weather is never just weather in this office.","That is what the weather wants you to think.","Spoken like someone with something to hide."]],["Who are you to ask?",["I am the person holding the pencil.","A doctor. A detective. Mostly a pencil.","Someone who has seen this exact sky before."]]]},
{q:["Let us review my notes. Latest entry: {N}","I keep records. Latest entry: {N}","Page one of my notebook says: {N}"],o:[["Read me another.",["I only read the latest. It is a rule.","Rules are rules. One entry per visit.","The older pages are sealed. For your safety."]],["That’s wrong.",["My notes are never wrong. Only early.","Wrong? I wrote it in pen. Mostly pencil.","Then explain the ink stain on page two."]],["Sounds suspicious.",["Now we are detectives together.","Finally, a colleague. Sit closer.","Suspicious is the correct word. Underlined."]]]},
{q:["One more time. Did the sound change first, or the sky?","Think carefully. Which moved first, the sound or the sky?","The key question, if you will: sound first, or sky first?"],o:[["The sound.",["Then the sky is the witness.","Sound first. The sky merely followed orders.","Then the sky is innocent. Probably."]],["The sky.",["Then the sound is the accomplice.","Sky first? Then the music is covering for it.","Bold. The notebook may disagree."]],["Both.",["Then there is a third party. There always is.","Both at once. Nobody is that coordinated.","Then someone is conducting them. Both."]]]}];
const WR={sunny:["Sunshine. Criminals love sunshine. Nobody checks their alibis.","Too bright. I do not trust a sky with nothing to hide."],cloudy:["Scattered clouds. Scattered thoughts, too.","Clouds drift. So do stories."],overcast:["Overcast. The sky is withholding.","Grey. The colour of a suspect who will not talk."],rain:["Listen to that rain. It is tapping out a confession.","Rain washes away evidence. Convenient."],storm:["Thunder. The sky is clearing its throat to testify.","A storm. Never a good sign for an alibi."],snow:["Snow. Everything quiet, everything covered. Very suspicious.","Snow buries footprints. How helpful for someone."],fog:["Fog. I cannot see the culprit, but neither can they.","In fog, everyone looks guilty."]};
const aside=()=>Math.random()<.45?' '+pk(WR[wx]):'';
const ST=[0,0,0];let lastCx=-1,lastAns='',tdone=0;
const O=(a,b,c)=>[a,b,c].map(x=>[x[0],x.slice(1)]),W=k=>()=>wx===k;
const CX=[
{w:W('sunny'),q:['Sunshine again. Everything lit, nothing hidden. Why does that bother me?','Bright out there. Do you ever feel watched by weather?'],o:O(['It feels warm, honestly.','Warmth lowers guards. Dangerous.','Warm. I wrote “warm” and circled it twice.'],['I’d rather not look at it.','Avoiding the light. Telling.','The window does not care about your preferences.'],['Is the sun a suspect?','Every large bright object is a suspect.','Do not laugh. The sun has no alibi at night.'])},
{w:W('cloudy'),q:['Scattered clouds. Scattered thoughts. Which ones are yours?','Partial cover. Half the sky is hiding something. Which half?'],o:O(['The left half, probably.','Left. Noted. I always suspected the left.','Probably. Probably is how every case begins.'],['Neither. Clouds are just clouds.','Said every witness before the third chapter.','Clouds are never just clouds. Ask a pilot.'],['Maybe the clouds are alibis.','An alibi made of vapor. Elegant.','Floating alibis. I am writing that down.'])},
{w:W('overcast'),q:['Heavy overcast. The sky is withholding. What is it withholding from you?','Grey ceiling. Does it press on you?'],o:O(['Honestly, a bit of relief.','Relief is the first thing to hide behind.','Relief. Yes. The lid is on. Nothing falls out.'],['Nothing. I feel fine.','Fine. The most expensive word I hear.','Fine is a coat. Take it off.'],['What if the grey is the clue?','Now you think like me. Slow down.','A clue the colour of every other day. Clever.'])},
{w:W('rain'),q:['Rain. Listen to that rhythm. Does it sound like someone counting?','The rain is tapping. Whose fingers are those?'],o:O(['It sounds like a clock.','A clock. Whose time is running out?','Time. Always time. Your answer is in the notes.'],['It sounds like nothing.','Nothing makes the loudest noise in this room.','Nothing is a very busy thing to listen to.'],['Could the rain be a signal?','A signal to whom? Do not answer. Yet.','Signals need receivers. I see only you.'])},
{w:W('storm'),q:['Thunder. The sky has stopped being polite. What did you do to provoke it?','A storm. Lightning shows everything for one second. What would it show on you?'],o:O(['I changed the sound. I’m sorry.','An apology, in a storm. Remarkably honest.','Sorry accepted. The thunder is not so sure.'],['Nothing. It started on its own.','They always say that. Then the lights go out.','On its own. Like a guilty conscience.'],['Let it strike. I’m curious.','Reckless. I respect that, and I fear it.','Curiosity killed the alibi. Fascinating.'])},
{w:W('snow'),q:['Snow. Everything soft, quiet, covered. What are you hoping gets buried?','Snow is falling. Footprints vanish. Whose were yours?'],o:O(['Nothing. I like the quiet.','Quiet is where confessions grow.','Quiet. Yes. I wrote “shh” in the margin.'],['Old footprints, maybe.','Old footprints. Now we are getting somewhere.','Maybe is not a footprint, but I will take it.'],['Snow leaves a trail by hiding one.','That is nearly poetry. Nearly evidence.','A trail by hiding. I am stealing that line.'])},
{w:W('fog'),q:['Fog. I cannot see the culprit, and neither can they. Or can you?','The fog is thick. Describe the last thing you saw clearly.'],o:O(['My own hands, I think.','Hands. The usual suspects.','Your hands. Mine are shaking slightly. Ignore that.'],['Honestly, nothing.','Nothing again. We keep arriving there.','Nothing is a very crowded room.'],['I saw the sound turn into sky.','Say that again. Slowly. I am writing.','Sound became sky. Nobody else has said that.'])},
{w:()=>S.drums,q:['Drums. Someone is knocking. Do you want to answer?','That drumbeat. Heartbeat, or alarm?'],o:O(['A heartbeat. Mine.','Yours. Mine joined in around the third beat.','A heartbeat. We share one now. Unfortunate.'],['An alarm. Obviously.','Alarm. Then who is on the other side of it?','Obviously. Nothing is obvious in here.'],['Turn it up and see.','Turning it up is how most cases get worse.','Bold. Lightning likes drums. Remember that.'])},
{w:()=>S.bpm>85,q:['The tempo is racing. What are you running from?','Fast music, fast weather. Slow down and tell me the truth.'],o:O(['Deadlines, mostly.','Deadlines. Mine is the end of this session.','Deadlines. Then we have something in common.'],['I’m not running.','Your foot is tapping at ninety beats.','Not running. Yet the wind is.'],['Maybe the wind is chasing me.','Wind never chases. It only follows. Think about it.','Chasing, following. The gap between them is my whole career.'])},
{w:()=>S.bpm<58,q:['The tempo has crawled. Everything is waiting. What are we waiting for?','Slow music. Slow clouds. Why am I whispering?'],o:O(['For the next change.','The next change. Pencil ready.','Patience. A rare habit in suspects.'],['For nothing. I’m relaxed.','Relaxed people do not check the window that often.','Relaxed. Then why did you sit on the edge?'],['Maybe time is the witness.','Time cannot testify. It can only pass. Sadly.','A witness that leaves every second. Terrible reliability.'])},
{w:()=>S.wet>.7,q:['So much echo. Every word comes back. Do you hear your own voice returning?','There is so much space in the sound. What fills it?'],o:O(['Yes, and it sounds younger.','Younger. Ink is already on the page.','Younger voices say truer things. Typically.'],['No echo. You’re imagining things.','I imagine things for a living. It pays poorly.','Imagine, then. Both of us.'],['The echo is the real witness.','An echo repeats, never lies. Excellent witness.','Witness: the echo. Alibi: the same, but delayed.'])},
{w:()=>!S.play,q:['The music has stopped. The sky is holding its breath. Did you do that?','Silence. In this office that is the loudest sound there is.'],o:O(['I just needed a moment.','A moment. I will give you thirty seconds.','Moments are what cases are made of.'],['I didn’t touch anything.','Nothing was touched. Everything changed. Familiar.','Hands off, as always.'],['Press play. Let’s see what breaks.','Now we experiment. Dr. Voss approves.','Science! Mostly impatience, but science.'])}];
const TH=[
['You cooperate too much. The sound is not a crime scene, it is a confession. The weather is {W} and it agrees.','A trusting witness. Your music writes the sky, the sky writes me. I am the last link.','You trust me, so I will trust the pattern: sound first, weather second, doctor third.'],
['You dodge every question. People dodge when the sky is their fault. Today it is {W}.','Evasion is data. Many dodges, one {W}. Not a coincidence.','Every evasion you make, the sky mirrors. I will prove it. Probably.'],
['Your curiosity is contagious. The weather is {W} because you asked. Possibly because I did.','You ask better questions than my notes do. That is a clue and a compliment.','You are not a suspect. You are an investigator who has not noticed yet.']];
const CHN=["The Chair","The Window","The Notebook","The Accusation","The Forecast"];
let ni=0,clues=0,tt,talking=false,ch=0,bi=0,wi=false,wx0=wx,F={};
const dom=()=>ST.indexOf(Math.max(...ST)),rs=x=>typeof x==="function"?x():pk([].concat(x));
const fmt=s=>s.replace(/\{W\}/g,WN[wx]).replace("{N}",(notes[0]||"Nothing yet. Suspicious.").replace(/^\[[\d:]+\] /,""));
function hud(){$("case").textContent=`· ${ch+1}/5 ${CHN[ch]} · Clues ${clues} · Trust ${ST[0]} · Suspicion ${ST[1]} · Curiosity ${ST[2]}`}
function tone(ix,l){ST[ix]++;lastAns=l;hud()}
function say(s,cb){clearInterval(tt);let i=0;talking=true;$("txt").textContent="";
